services:
  # =====================
  # Service Nginx (Reverse Proxy + HTTPS)
  # Satu-satunya pintu masuk dari internet (port 80/443).
  # =====================
  nginx:
    image: nginx:1.27-alpine
    container_name: cashmate-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certbot_www:/var/www/certbot:ro
      - nginx_certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      cashmate-net:
        ipv4_address: 172.20.0.10

  # =====================
  # Service API (Golang)
  # =====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashmate-api
    restart: always
    # Publik dapat mengakses API langsung via http://VPS_IP:8096 .
    ports:
      - "8096:8096"
    env_file:
      - .env
    environment:
      # IP nginx di dalam Docker network �?" untuk menghitung ClientIP yang benar.
      TRUSTED_PROXIES: 172.20.0.10
    volumes:
      # Foto transaksi & foto profil tetap ada saat container di-recreate.
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8096/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      cashmate-net:
        ipv4_address: 172.20.0.11

 

  # =====================
  # Service Certbot (Renewal SSL otomatis tiap 12 jam)
  # =====================
  certbot:
    image: certbot/certbot:latest
    container_name: cashmate-certbot
    restart: unless-stopped
    volumes:
      - nginx_certbot_www:/var/www/certbot
      - nginx_certbot_certs:/etc/letsencrypt
    depends_on:
      - nginx
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew;
        sleep 12h & wait $${!};
      done;'

# Named volume untuk sertifikat SSL
volumes:
  nginx_certbot_www:
  nginx_certbot_certs:
  api_uploads:

# Bridge network dengan subnet fix agar IP nginx bisa dipakai sebagai trusted proxy
networks:
  cashmate-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24