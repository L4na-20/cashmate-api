# =============================================
# Nginx config untuk port 80 (HTTP + ACME challenge)
# HTTPS (443) dibuat otomatis oleh scripts/init-letsencrypt.sh
# dengan mengisi template nginx/templates/cashmate-ssl.conf.tpl
# =============================================

upstream cashmate_api {
    server api:8096;
}

server {
    listen 80;
    server_name _;

    # Lokasi verifikasi Let's Encrypt (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://cashmate_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}